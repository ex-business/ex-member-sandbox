<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来源事件模拟</title><link rel="stylesheet" href="/style.css"><script src="/simulation.js" defer></script></head><body class="simulation-page"><header><a class="brand" href="/">M<span>会员沙箱<small>来源事件模拟</small></span></a><a href="/">返回会员页面</a></header><main><section class="card" id="account"><h1>来源事件模拟</h1><p>仅为当前登录会员生成模拟充值、投注、退款和撤单。不充值真实钱包，不创建真实注单。</p><p id="member"></p><p id="currency"></p><form id="event-form"><label>事件类型<select id="kind"><option value="DEPOSIT_SUCCEEDED">充值成功</option><option value="BET_SETTLED">投注已结算</option><option value="DEPOSIT_REFUNDED">充值退款</option><option value="BET_CANCELLED">投注撤单</option></select></label><label>业务单号<input id="business" maxlength="128" required placeholder="每笔业务使用唯一单号"></label><label id="original-label" hidden>原业务单号<input id="original" maxlength="128"></label><label id="reversal-reason-label" hidden>冲正原因<input id="reversal-reason" maxlength="128"></label><label>金额<input id="amount" inputmode="decimal" required placeholder="例如 50.00"></label><label id="valid-label" hidden>有效投注金额<input id="valid" inputmode="decimal" value="0"></label><label id="venue-label" hidden>场馆编号<input id="venue" maxlength="128" placeholder="例如 SPORTS"></label><button class="primary" id="save" type="submit">保存并排队投递</button></form><p class="hint">注册事件由原注册流程生成。自动重试保留原始事件；业务拒绝需修正原因后按原事实补发。</p><div class="section-head"><h2>我的来源事件</h2><button id="refresh" type="button">刷新</button></div><div class="table-wrap"><table><thead><tr><th>类型 / 业务单号</th><th>事件编号</th><th>状态</th><th>尝试次数</th><th>结果码</th><th>下次重试</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div><p class="hint">“已接收”只表示佣金系统确认收到；不代表已经计佣、领取或到账。最多显示本会员最近100条业务事件。</p><label>补发原因<input id="reason" maxlength="500" placeholder="先填写原因，再点击对应事件的补发"></label><p id="notice" role="status"></p></section></main></body></html>
